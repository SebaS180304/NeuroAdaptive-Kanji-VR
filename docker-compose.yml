services:
  db:
    image: postgres:16
    container_name: neuroadaptive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuroadaptive
      POSTGRES_PASSWORD: neuroadaptive_dev_password
      POSTGRES_DB: neuroadaptive_vr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroadaptive -d neuroadaptive_vr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: neuroadaptive_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Portal web para inspeccionar la base de datos y lanzar queries.
  #
  # Abrir http://localhost:8081 y loguear con las credenciales de
  # PGADMIN_DEFAULT_* de abajo. La conexion a "NeuroAdaptive VR
  # (docker)" ya queda pre-cargada (./pgadmin/servers.json) -- solo
  # pide la contrasena de Postgres (POSTGRES_PASSWORD) la primera vez
  # que se expande el server, no bien entrando.
  #
  # Solo herramienta de desarrollo. Se publica en 127.0.0.1 a proposito
  # para que no sea alcanzable desde la red local.
  #
  # NOTA DE SEGURIDAD: las contrasenas van en claro aqui, igual que en
  # el servicio db de arriba. Es aceptable para una base de desarrollo
  # local sin datos reales. Antes de que entren datos de participantes
  # o EEG, las credenciales deben salir del archivo y venir de
  # variables de entorno o un gestor de secretos.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neuroadaptive_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@neuroadaptive.example.com
      PGADMIN_DEFAULT_PASSWORD: neuroadaptive_dev_password
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  # Herramientas de contenido kanji. Perfil "tools": `docker compose up` NO la
  # levanta, es un contenedor de un solo disparo.
  #
  #   docker compose run --rm kanji-tools python tools/kanji_metrics.py
  #   docker compose run --rm kanji-tools python tools/kanji_metrics.py --export
  #
  # Existe porque las metricas dependen de la tipografia (ver tools/Dockerfile)
  # y porque la maquina de desarrollo no tiene ni las dependencias ni la fuente.
  # Sin esto, "regenerar en el mismo commit que cambia un kanji" seria una regla
  # que nadie del equipo puede cumplir.
  kanji-tools:
    build:
      context: ./tools
    container_name: neuroadaptive_kanji_tools
    profiles: ["tools"]
    # El repositorio entero, porque el script escribe el contrato de contenido
    # en unity-client/Assets/Resources/ -- directamente donde Unity lo lee, sin
    # copias intermedias.
    volumes:
      - .:/repo
    working_dir: /repo


volumes:
  pgdata:
  pgadmin_data:

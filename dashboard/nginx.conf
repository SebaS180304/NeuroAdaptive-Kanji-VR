# M0 (D-F6-231 (5), D-F6-247 (1)): the built portal (dashboard/dist) on 127.0.0.1:5300, as the Vite dev server served it.
# /api/... goes to the backend with the prefix stripped, as vite.config.ts's proxy does. Client routes fall back to
# index.html. No outside hosts: fonts are bundled (skill rule 7).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, looked up again every 10 s: a recreated backend container (new IP) does not leave a stale 502.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
